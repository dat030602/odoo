<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="maintShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerMaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <marker id="maintArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="maintArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="maintArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="maintArrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="15" width="1030" height="50" rx="8" fill="url(#headerMaint)" filter="url(#maintShadow)"/>
  <text x="45" y="46" fill="#ffffff" font-size="18" font-weight="700">Queue Lifecycle, Exponential Backoff &amp; Retention Purge Flow</text>
  <text x="770" y="46" fill="#ccfbf1" font-size="12" font-weight="600">ir_cron_inbound_process &amp; retention</text>

  <!-- TOP SECTION: Message Processing Pipeline -->
  <g transform="translate(25, 80)">
    <rect x="0" y="0" width="1030" height="135" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#maintShadow)"/>
    <text x="20" y="24" fill="#0f172a" font-size="13" font-weight="700">1. INBOUND MESSAGE PROCESSING CYCLE</text>

    <!-- Node: Received -->
    <rect x="20" y="45" width="140" height="65" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="45" y="70" fill="#0369a1" font-size="13" font-weight="700">received</text>
    <text x="35" y="90" fill="#475569" font-size="10">Fast HTTP Ingest</text>

    <line x1="160" y1="78" x2="200" y2="78" stroke="#0284c7" stroke-width="2" marker-end="url(#maintArrow)"/>

    <!-- Node: Queued -->
    <rect x="205" y="45" width="150" height="65" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="245" y="70" fill="#5b21b6" font-size="13" font-weight="700">queued</text>
    <text x="220" y="90" fill="#475569" font-size="10">Awaiting Cron Worker</text>

    <line x1="355" y1="78" x2="395" y2="78" stroke="#7c3aed" stroke-width="2" marker-end="url(#maintArrowPurple)"/>

    <!-- Node: Processing -->
    <rect x="400" y="45" width="170" height="65" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="440" y="70" fill="#92400e" font-size="13" font-weight="700">processing</text>
    <text x="415" y="90" fill="#475569" font-size="10">Row Locked (SKIP LOCKED)</text>

    <!-- Branch to Success (Done) -->
    <line x1="570" y1="65" x2="685" y2="65" stroke="#16a34a" stroke-width="2.5" marker-end="url(#maintArrowGreen)"/>
    <text x="585" y="55" fill="#15803d" font-size="10" font-weight="700">Handler Success</text>

    <!-- Node: Done -->
    <rect x="690" y="35" width="150" height="85" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="735" y="60" fill="#14532d" font-size="14" font-weight="700">done</text>
    <text x="705" y="78" fill="#166534" font-size="10">HTTP 200 Recorded</text>
    <text x="705" y="94" fill="#166534" font-size="10">duration_ms saved</text>

    <!-- Branch to Failure -->
    <path d="M 485 110 L 485 150 L 485 170" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#maintArrowRed)"/>
    <text x="495" y="145" fill="#e11d48" font-size="10" font-weight="700">Exception</text>

    <!-- Node: Skipped -->
    <rect x="870" y="45" width="140" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="910" y="70" fill="#475569" font-size="13" font-weight="700">skipped</text>
    <text x="880" y="90" fill="#64748b" font-size="10">Duplicate Idempotency</text>
  </g>

  <!-- MIDDLE SECTION: Exponential Backoff & DLQ -->
  <g transform="translate(25, 230)">
    <rect x="0" y="0" width="1030" height="230" rx="10" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#maintShadow)"/>
    <text x="20" y="25" fill="#9f1239" font-size="13" font-weight="700">2. EXCEPTION RECOVERY: EXPONENTIAL BACKOFF &amp; DEAD LETTER QUEUE (DLQ)</text>

    <!-- Retry Loop Box -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="450" height="165" rx="8" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="15" y="24" fill="#be123c" font-size="13" font-weight="700">State: 'failed' (attempts &lt; max_attempts)</text>
      
      <text x="15" y="50" fill="#475569" font-size="11" font-weight="600">Exponential Backoff Formula:</text>
      <rect x="15" y="58" width="420" height="28" rx="4" fill="#fff1f2"/>
      <text x="25" y="77" fill="#881337" font-size="11" font-family="monospace">delay = min(3600, 10 * 2^attempts) + random_jitter</text>

      <text x="15" y="110" fill="#475569" font-size="11">• Attempt 1: ~20s delay | Attempt 2: ~40s delay</text>
      <text x="15" y="128" fill="#475569" font-size="11">• Attempt 3: ~80s delay | Attempt 4: ~160s delay</text>
      <text x="15" y="148" fill="#0369a1" font-size="10" font-weight="600">Timer next_retry_at set → cron skips until time arrives</text>
    </g>

    <!-- Transition Line from Failed to DLQ -->
    <line x1="470" y1="125" x2="520" y2="125" stroke="#e11d48" stroke-width="2.5" marker-end="url(#maintArrowRed)"/>
    <text x="475" y="115" fill="#be123c" font-size="9" font-weight="700">attempts ≥ 5</text>

    <!-- DLQ Box -->
    <g transform="translate(530, 45)">
      <rect x="0" y="0" width="480" height="165" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
      <text x="15" y="24" fill="#881337" font-size="14" font-weight="700">State: 'dead' (Quarantined in Dead Letter Queue)</text>
      
      <text x="15" y="48" fill="#475569" font-size="11">Poison-pill message isolated to prevent blocking valid traffic</text>
      
      <rect x="15" y="60" width="450" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="25" y="80" fill="#0f172a" font-size="11" font-weight="700">Operator Remediation Workflow:</text>
      <text x="25" y="98" fill="#334155" font-size="10">1. Inspect stack traceback in "Diagnostic Traceback" tab</text>
      <text x="25" y="112" fill="#334155" font-size="10">2. Fix Odoo master data (or patch JSON payload directly)</text>

      <rect x="15" y="120" width="450" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="25" y="141" fill="#1d4ed8" font-size="11" font-weight="700">Manual Replay: Click "Process Now" header button to re-run</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: Daily Retention Purging -->
  <g transform="translate(25, 480)">
    <rect x="0" y="0" width="1030" height="235" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" filter="url(#maintShadow)"/>
    <text x="20" y="25" fill="#0f766e" font-size="13" font-weight="700">3. AUTOMATED DAILY RETENTION PURGE ENGINE (ir_cron_inbound_retention)</text>
    
    <!-- Config Parameters Display -->
    <g transform="translate(20, 45)">
      <!-- Done Retention Card -->
      <rect x="0" y="0" width="480" height="110" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
      <text x="15" y="24" fill="#0f766e" font-size="13" font-weight="700">Message Retention (Done)</text>
      <text x="15" y="44" fill="#475569" font-size="11">System Param: <tspan font-family="monospace">dn_connector_base.retention_days_done</tspan></text>
      
      <rect x="15" y="55" width="130" height="32" rx="4" fill="#ccfbf1"/>
      <text x="25" y="76" fill="#0f766e" font-size="14" font-weight="700">Default: 30 Days</text>
      <text x="160" y="76" fill="#334155" font-size="10">Deletes successful messages older than 30 days</text>
      
      <text x="15" y="100" fill="#64748b" font-size="9">Keeps production database lean while maintaining operational audit trails</text>

      <!-- Dead Letter Retention Card -->
      <rect x="510" y="0" width="480" height="110" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
      <text x="525" y="24" fill="#0f766e" font-size="13" font-weight="700">Dead Letter Retention (Dead)</text>
      <text x="525" y="44" fill="#475569" font-size="11">System Param: <tspan font-family="monospace">dn_connector_base.retention_days_dead</tspan></text>
      
      <rect x="525" y="55" width="130" height="32" rx="4" fill="#ccfbf1"/>
      <text x="535" y="76" fill="#0f766e" font-size="14" font-weight="700">Default: 90 Days</text>
      <text x="670" y="76" fill="#334155" font-size="10">Preserves poison pills for forensic debugging</text>
      
      <text x="525" y="100" fill="#64748b" font-size="9">Provides 3-month window for engineering to fix bugs and replay historical events</text>
    </g>

    <!-- High-Performance Chunk Deletion Banner -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="990" height="50" rx="6" fill="#ffffff" stroke="#14b8a6" stroke-width="1"/>
      <text x="20" y="24" fill="#0f766e" font-size="12" font-weight="700">Chunked Batch Deletion Safety Guard (chunk_size = 5,000 records):</text>
      <text x="20" y="40" fill="#134e4a" font-size="11" font-family="monospace">self.search([('state', '=', 'done'), ('received_at', '&lt;', cutoff)], limit=5000).unlink()</text>
      <text x="640" y="32" fill="#047857" font-size="10" font-weight="600">✓ Prevents PostgreSQL table locks</text>
      <text x="640" y="45" fill="#047857" font-size="10" font-weight="600">✓ Safe for high-volume 24/7 databases</text>
    </g>
  </g>
</svg>
