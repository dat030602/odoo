<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="formShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerEndpoint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="stateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="formArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="25" y="15" width="1030" height="50" rx="8" fill="url(#headerEndpoint)" filter="url(#formShadow)"/>
  <text x="45" y="46" fill="#ffffff" font-size="18" font-weight="700">Inbound Endpoint Anatomy &amp; Parameter Flow</text>
  <text x="820" y="46" fill="#e0f2fe" font-size="12" font-weight="600">connector.inbound.endpoint</text>

  <!-- Status Bar & Stat Buttons Top Row -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="1030" height="55" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Lifecycle State Badges -->
    <text x="20" y="32" fill="#475569" font-size="12" font-weight="700">LIFECYCLE STATE:</text>
    
    <rect x="145" y="14" width="90" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="160" y="32" fill="#64748b" font-size="11" font-weight="600">Draft (404)</text>

    <line x1="240" y1="28" x2="260" y2="28" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="265" y="14" width="100" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="277" y="32" fill="#15803d" font-size="11" font-weight="700">Active (200)</text>

    <line x1="370" y1="28" x2="390" y2="28" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="395" y="14" width="105" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="405" y="32" fill="#b45309" font-size="11" font-weight="600">Paused (503)</text>

    <!-- Smart Stat Buttons -->
    <rect x="740" y="10" width="130" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="755" y="26" fill="#0f172a" font-size="13" font-weight="700">📥 Messages</text>
    <text x="755" y="39" fill="#0284c7" font-size="10" font-weight="600">Total Inbox Count</text>

    <rect x="885" y="10" width="130" height="36" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
    <text x="900" y="26" fill="#dc2626" font-size="13" font-weight="700">⚠️ Dead Letters</text>
    <text x="900" y="39" fill="#e11d48" font-size="10" font-weight="600">Quarantined DLQ</text>
  </g>

  <!-- Left Column: Gateway Routing & Network Security -->
  <g transform="translate(25, 140)">
    <!-- Box 1: Routing -->
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" filter="url(#formShadow)"/>
    <rect x="0" y="0" width="500" height="32" rx="10" fill="#f0f9ff"/>
    <text x="15" y="21" fill="#0369a1" font-size="13" font-weight="700">1. Gateway Routing Parameters</text>

    <text x="15" y="55" fill="#475569" font-size="11" font-weight="600">Framework Preset:</text>
    <rect x="150" y="40" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="56" fill="#0f172a" font-size="11">Shopify / GitHub / Stripe / Custom</text>

    <text x="15" y="90" fill="#475569" font-size="11" font-weight="600">URL Route Token:</text>
    <rect x="150" y="75" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="91" fill="#0f172a" font-size="11" font-family="monospace">9f8a3c21-4b72-4d1e-8e9a-653c071d1822 (UUIDv4)</text>

    <text x="15" y="125" fill="#475569" font-size="11" font-weight="600">Computed Webhook URL:</text>
    <rect x="150" y="110" width="335" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="160" y="126" fill="#1d4ed8" font-size="10" font-family="monospace">https://odoo.com/connector/in/&lt;token&gt;</text>

    <text x="15" y="160" fill="#475569" font-size="11" font-weight="600">Allowed HTTP Methods:</text>
    <rect x="150" y="145" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="161" fill="#0f172a" font-size="11">POST Only • POST &amp; PUT • ALL (Violations → 405)</text>

    <text x="15" y="195" fill="#475569" font-size="11" font-weight="600">Multi-Company Scope:</text>
    <rect x="150" y="180" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="196" fill="#0f172a" font-size="11">Partitioned by company_id (res.company)</text>
  </g>

  <!-- Right Column: Security, Network & Throttling -->
  <g transform="translate(555, 140)">
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#formShadow)"/>
    <rect x="0" y="0" width="500" height="32" rx="10" fill="#f8fafc"/>
    <text x="15" y="21" fill="#0f172a" font-size="13" font-weight="700">2. Security, IP Guards &amp; Circuit Breaker</text>

    <text x="15" y="55" fill="#475569" font-size="11" font-weight="600">Auth Override:</text>
    <rect x="150" y="40" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="56" fill="#0f172a" font-size="11">Inherit Framework • None • Bearer • HMAC</text>

    <text x="15" y="90" fill="#475569" font-size="11" font-weight="600">Secret Credential:</text>
    <rect x="150" y="75" width="335" height="24" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="160" y="91" fill="#dc2626" font-size="11">•••••••••••••••• (Protected: base.group_system)</text>

    <text x="15" y="125" fill="#475569" font-size="11" font-weight="600">IP Allowlist Guard:</text>
    <rect x="150" y="110" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="126" fill="#0f172a" font-size="11">IPv4/v6 &amp; Subnets (e.g. 192.168.1.0/24) → 403</text>

    <text x="15" y="160" fill="#475569" font-size="11" font-weight="600">Circuit Breaker Backlog:</text>
    <rect x="150" y="145" width="335" height="24" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="160" y="161" fill="#b45309" font-size="11" font-weight="700">max_backlog = 10,000 (Exceeded → HTTP 429)</text>

    <text x="15" y="195" fill="#475569" font-size="11" font-weight="600">Retention Override:</text>
    <rect x="150" y="180" width="335" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="160" y="196" fill="#0f172a" font-size="11">Endpoint Days Override (0 = use system setting)</text>
  </g>

  <!-- Bottom Row: Execution Modes & Handlers -->
  <g transform="translate(25, 375)">
    <rect x="0" y="0" width="1030" height="225" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#formShadow)"/>
    <rect x="0" y="0" width="1030" height="32" rx="10" fill="#faf5ff"/>
    <text x="15" y="21" fill="#6b21a8" font-size="13" font-weight="700">3. Execution Engine &amp; Handler Type Configuration</text>

    <!-- Column 1: Handlers -->
    <g transform="translate(15, 45)">
      <text x="0" y="15" fill="#0f172a" font-size="12" font-weight="700">PLUGGABLE HANDLER TYPES:</text>
      
      <rect x="0" y="25" width="310" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="42" fill="#0f172a" font-size="11">📦 store_only: Raw Audit Inbox Archive</text>
      
      <rect x="0" y="55" width="310" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="72" fill="#0f172a" font-size="11">🗄️ raw_model: Auto Dynamic Model (x_*)</text>
      
      <rect x="0" y="85" width="310" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="102" fill="#0f172a" font-size="11">⚡ server_action: Invoke ir.actions.server</text>
      
      <rect x="0" y="115" width="310" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="132" fill="#0f172a" font-size="11">🐍 python: Safe Eval with _dynamic_import</text>

      <rect x="0" y="145" width="310" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="162" fill="#0f172a" font-size="11">🧩 pack: Downstream Module (e.g. vn_address)</text>
    </g>

    <!-- Column 2: Execution Mode -->
    <g transform="translate(355, 45)">
      <text x="0" y="15" fill="#0f172a" font-size="12" font-weight="700">EXECUTION MODE &amp; RESPONSE:</text>
      
      <rect x="0" y="25" width="310" height="42" rx="4" fill="#f0fdf4" stroke="#86efac"/>
      <text x="10" y="42" fill="#15803d" font-size="11" font-weight="700">Deferred Mode (Recommended):</text>
      <text x="10" y="57" fill="#166534" font-size="10">HTTP 202 Accepted in &lt;50ms, cron executes queue</text>
      
      <rect x="0" y="75" width="310" height="42" rx="4" fill="#fffbeb" stroke="#fde68a"/>
      <text x="10" y="92" fill="#b45309" font-size="11" font-weight="700">Immediate Mode (Sync):</text>
      <text x="10" y="107" fill="#92400e" font-size="10">Synchronous inline execution, returns 200 payload</text>

      <rect x="0" y="125" width="310" height="45" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="10" y="142" fill="#0f172a" font-size="11" font-weight="600">Priority Levels:</text>
      <text x="10" y="158" fill="#64748b" font-size="10">Low (0) • Normal (1) • High (2) • Urgent (3)</text>
    </g>

    <!-- Column 3: Sequential Ordering -->
    <g transform="translate(695, 45)">
      <text x="0" y="15" fill="#0f172a" font-size="12" font-weight="700">SEQUENTIAL FIFO ORDERING:</text>
      
      <rect x="0" y="25" width="310" height="60" rx="4" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="10" y="42" fill="#5b21b6" font-size="11" font-weight="700">ordering_key: 'entity_id'</text>
      <text x="10" y="58" fill="#6d28d9" font-size="10">ordering_json_path: 'id' or 'order_number'</text>
      <text x="10" y="74" fill="#6d28d9" font-size="10">Blocks newer events until prior events finish</text>

      <rect x="0" y="95" width="310" height="75" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="112" fill="#1e40af" font-size="11" font-weight="700">Guarantees Order of Events:</text>
      <text x="10" y="128" fill="#1d4ed8" font-size="10">1. order.created (Processed first)</text>
      <text x="10" y="144" fill="#1d4ed8" font-size="10">2. order.updated (Held until #1 is 'done')</text>
      <text x="10" y="160" fill="#1d4ed8" font-size="10">3. order.cancelled (Held until #2 is 'done')</text>
    </g>
  </g>
</svg>
