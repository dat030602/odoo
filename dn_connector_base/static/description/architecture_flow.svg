<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="callerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="fastRxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="inboxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="cronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="dlqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="60" rx="12" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="50" y="56" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="0.5">dn_connector_base • Universal Inbound Gateway &amp; Concurrency Architecture</text>
  <text x="890" y="56" fill="#ccfbf1" font-size="13" font-weight="600">Odoo 19.0 Enterprise / Community</text>

  <!-- 1. External Webhook Callers -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="1040" height="70" rx="10" fill="url(#callerGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="32" fill="#0f172a" font-size="15" font-weight="700">1. External Webhook Callers</text>
    <text x="25" y="52" fill="#64748b" font-size="12">Heterogeneous event producers publishing real-time transactional payloads over HTTPS</text>
    
    <!-- Badges -->
    <rect x="520" y="20" width="105" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="532" y="40" fill="#0f172a" font-size="12" font-weight="600">🛍️ Shopify</text>
    <rect x="635" y="20" width="105" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="647" y="40" fill="#0f172a" font-size="12" font-weight="600">🐙 GitHub</text>
    <rect x="750" y="20" width="105" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="765" y="40" fill="#0f172a" font-size="12" font-weight="600">💳 Stripe</text>
    <rect x="865" y="20" width="150" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="877" y="40" fill="#0f172a" font-size="12" font-weight="600">⚡ REST Microservices</text>
  </g>

  <!-- Arrow down to Nginx -->
  <line x1="550" y1="170" x2="550" y2="198" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="188" fill="#0369a1" font-size="11" font-weight="600">HTTPS POST /connector/in/&lt;token&gt;</text>

  <!-- 2. Nginx Reverse Proxy -->
  <g transform="translate(30, 205)">
    <rect x="0" y="0" width="1040" height="60" rx="10" fill="url(#nginxGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="25" y="30" fill="#065f46" font-size="14" font-weight="700">2. Nginx Edge Reverse Proxy</text>
    <text x="25" y="48" fill="#047857" font-size="11">SSL/TLS Termination • limit_req 100r/s (burst=50 nodelay) • X-Forwarded-For • dbfilter Database Pinning</text>
    <rect x="870" y="16" width="145" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="882" y="34" fill="#065f46" font-size="11" font-weight="700">Max Body: 15 MB</text>
  </g>

  <!-- Arrow down to Fast Inbound Receiver -->
  <line x1="550" y1="265" x2="550" y2="293" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="283" fill="#0369a1" font-size="11" font-weight="600">Reverse Proxy Pass to Odoo HTTP Worker</text>

  <!-- 3. Fast Inbound Receiver Controller -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="1040" height="155" rx="12" fill="url(#fastRxGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header of Fast Receiver -->
    <rect x="0" y="0" width="1040" height="34" rx="10" fill="#0284c7"/>
    <text x="20" y="23" fill="#ffffff" font-size="14" font-weight="700">3. Fast Inbound Receiver Gateway Controller • /connector/in/&lt;string:token&gt; • Turnaround &lt; 50 ms</text>
    <text x="890" y="23" fill="#e0f2fe" font-size="11" font-weight="600">auth='public' | csrf=False</text>

    <!-- Pipeline steps inside Fast Receiver -->
    <g transform="translate(15, 48)">
      <!-- Step 1: Token -->
      <rect x="0" y="0" width="135" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">1. Token Lookup</text>
      <text x="10" y="42" fill="#475569" font-size="10">Active: Proceed</text>
      <text x="10" y="58" fill="#dc2626" font-size="10">Draft: 404</text>
      <text x="10" y="74" fill="#d97706" font-size="10">Paused: 503</text>
      
      <!-- Step 2: Method -->
      <rect x="145" y="0" width="135" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">2. Method Guard</text>
      <text x="10" y="42" fill="#475569" font-size="10">POST Only</text>
      <text x="10" y="58" fill="#475569" font-size="10">POST / PUT</text>
      <text x="10" y="74" fill="#dc2626" font-size="10">Mismatch: 405</text>

      <!-- Step 3: IP Allowlist -->
      <rect x="290" y="0" width="145" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">3. IP Allowlist</text>
      <text x="10" y="42" fill="#475569" font-size="10">X-Forwarded-For</text>
      <text x="10" y="58" fill="#475569" font-size="10">CIDR &amp; Exact IPs</text>
      <text x="10" y="74" fill="#dc2626" font-size="10">Denied: 403</text>

      <!-- Step 4: Circuit Breaker -->
      <rect x="445" y="0" width="140" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">4. Circuit Breaker</text>
      <text x="10" y="42" fill="#475569" font-size="10">max_backlog</text>
      <text x="10" y="58" fill="#475569" font-size="10">&gt; 10,000 pending</text>
      <text x="10" y="74" fill="#d97706" font-size="10">HTTP 429 Throttle</text>

      <!-- Step 5: Auth & HMAC -->
      <rect x="595" y="0" width="140" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">5. Auth &amp; HMAC</text>
      <text x="10" y="42" fill="#475569" font-size="10">SHA256/1/512</text>
      <text x="10" y="58" fill="#475569" font-size="10">Hex / Base64</text>
      <text x="10" y="74" fill="#dc2626" font-size="10">Invalid: 401</text>

      <!-- Step 6: Deduplication -->
      <rect x="745" y="0" width="130" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">6. Idempotency</text>
      <text x="10" y="42" fill="#475569" font-size="10">Header / JSON Path</text>
      <text x="10" y="58" fill="#475569" font-size="10">Unique Key Check</text>
      <text x="10" y="74" fill="#16a34a" font-size="10">Dupe: 200 Fast Ack</text>

      <!-- Step 7: Savepoint -->
      <rect x="885" y="0" width="120" height="92" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="10" y="22" fill="#0369a1" font-size="12" font-weight="700">7. Inbox Staging</text>
      <text x="10" y="42" fill="#475569" font-size="10">cr.savepoint()</text>
      <text x="10" y="58" fill="#475569" font-size="10">Persist Raw Body</text>
      <text x="10" y="74" fill="#16a34a" font-size="10">Integrity Safe</text>
    </g>
  </g>

  <!-- Branching Lines from Receiver -->
  <!-- Left branch: Immediate Sync Mode -->
  <path d="M 280 455 L 280 495 L 180 495 L 180 520" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="195" y="482" width="155" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="205" y="498" fill="#92400e" font-size="11" font-weight="700">Mode: Immediate (Sync)</text>

  <!-- Right branch: Deferred Async Mode -->
  <path d="M 800 455 L 800 495 L 680 495 L 680 520" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <rect x="695" y="482" width="185" height="24" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
  <text x="705" y="498" fill="#0f766e" font-size="11" font-weight="700">Mode: Deferred (Async Inbox)</text>

  <!-- Immediate Execution Box -->
  <g transform="translate(30, 525)">
    <rect x="0" y="0" width="300" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="15" y="24" fill="#92400e" font-size="13" font-weight="700">Synchronous Inline Execution</text>
    <text x="15" y="44" fill="#78350f" font-size="11">• message.process_message() runs immediately</text>
    <text x="15" y="60" fill="#78350f" font-size="11">• Commits transaction inline in HTTP thread</text>
    <text x="15" y="78" fill="#16a34a" font-size="11" font-weight="700">Returns: HTTP 200 + Handler JSON Result</text>
  </g>

  <!-- Deferred Fast Ack + Transactional Inbox Box -->
  <g transform="translate(350, 525)">
    <rect x="0" y="0" width="720" height="90" rx="10" fill="url(#inboxGrad)" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="25" fill="#5b21b6" font-size="14" font-weight="700">Transactional Inbox Persistence • connector.inbound.message (State: 'queued')</text>
    <text x="20" y="46" fill="#6d28d9" font-size="12">1. Fast Return: Gateway responds with HTTP 202 Accepted {"status": "queued", "uuid": "&lt;uuid&gt;"} in &lt;50ms</text>
    <text x="20" y="66" fill="#6d28d9" font-size="12">2. Zero Registry Freeze: External webhook connection terminates immediately. ORM processing is deferred.</text>
    <text x="20" y="82" fill="#4c1d95" font-size="11" font-weight="600">Guarantees: Zero Data Loss • Idempotent Unique Constraints • Chronological Audit Trail</text>
  </g>

  <!-- Arrow down to Cron Processor -->
  <line x1="710" y1="615" x2="710" y2="648" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="720" y="636" fill="#6d28d9" font-size="11" font-weight="600">Scheduled Inbound Processor (ir_cron_inbound_process - Every 1 Min)</text>

  <!-- 4. Batch Cron Processor with SKIP LOCKED -->
  <g transform="translate(30, 655)">
    <rect x="0" y="0" width="1040" height="75" rx="10" fill="url(#cronGrad)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="25" fill="#1e40af" font-size="14" font-weight="700">4. Resilient Concurrency Engine: Multi-Worker Batch Claiming via SKIP LOCKED</text>
    <text x="20" y="45" fill="#1e3a8a" font-size="11" font-family="monospace">SELECT id FROM connector_inbound_message WHERE state IN ('queued', 'failed') AND next_retry_at &lt;= NOW()</text>
    <text x="20" y="62" fill="#1e3a8a" font-size="11" font-family="monospace">ORDER BY priority DESC, received_at ASC LIMIT batch_size FOR UPDATE SKIP LOCKED;</text>

    <!-- Worker badges on right -->
    <rect x="830" y="15" width="190" height="46" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="842" y="32" fill="#1d4ed8" font-size="11" font-weight="700">Multi-Worker Parallelism</text>
    <text x="842" y="50" fill="#475569" font-size="10">Worker 1, 2...N no lock collisions</text>
  </g>

  <!-- Arrow down to Handlers -->
  <line x1="550" y1="730" x2="550" y2="758" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5. Pluggable Handlers & Outcomes Split -->
  <g transform="translate(30, 765)">
    <!-- Success: Done -->
    <rect x="0" y="0" width="505" height="115" rx="10" fill="url(#successGrad)" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="25" fill="#15803d" font-size="14" font-weight="700">5A. Successful Execution • State: 'done'</text>
    <text x="20" y="45" fill="#166534" font-size="11">• Handler dispatched: store_only, raw_model, server_action, python, pack</text>
    <text x="20" y="62" fill="#166534" font-size="11">• State updated to 'done' | duration_ms and response_body recorded</text>
    <text x="20" y="80" fill="#166534" font-size="11">• HTTP status 200 committed | Sequential ordering locks released</text>
    <rect x="20" y="90" width="465" height="18" rx="4" fill="#16a34a" fill-opacity="0.1"/>
    <text x="30" y="103" fill="#14532d" font-size="10" font-weight="600">Daily Purge: ir_cron_inbound_retention removes 'done' records &gt; 30 days</text>

    <!-- Failure: Retry or DLQ -->
    <rect x="535" y="0" width="505" height="115" rx="10" fill="url(#dlqGrad)" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="555" y="25" fill="#be123c" font-size="14" font-weight="700">5B. Exception Handling &amp; Dead Letter Queue (DLQ)</text>
    <text x="555" y="45" fill="#9f1239" font-size="11">• attempts &lt; max_attempts: State 'failed', next_retry_at = 10 * 2^attempts + jitter</text>
    <text x="555" y="62" fill="#9f1239" font-size="11">• attempts &gt;= 5: State transitions to 'dead' (Quarantined in DLQ)</text>
    <text x="555" y="80" fill="#9f1239" font-size="11">• Operator reviews traceback, fixes payload/master data, clicks 'Process Now'</text>
    <rect x="555" y="90" width="465" height="18" rx="4" fill="#e11d48" fill-opacity="0.1"/>
    <text x="565" y="103" fill="#881337" font-size="10" font-weight="600">Daily Purge: ir_cron_inbound_retention purges 'dead' records &gt; 90 days</text>
  </g>
</svg>
