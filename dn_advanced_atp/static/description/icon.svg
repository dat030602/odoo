<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient công nghệ kết hợp tím Odoo và xanh Teal -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#017E84;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Biểu tượng chính (Nền và các đường nét liên kết) -->
  <g transform="translate(10, 10)">
    <!-- Đường viền cách điệu hình chữ D mang tính kết nối dữ liệu -->
    <path d="M 15,5 L 50,5 C 72,5 78,22 78,40 C 78,58 72,75 50,75 L 15,75 Z" fill="none" stroke="url(#iconGradient)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Các đường nét bên trong mô phỏng cấu trúc chữ N và V lồng nhau -->
    <path d="M 35,28 L 35,75 L 58,28 L 58,75" fill="none" stroke="#2C3E50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Hai điểm nối công nghệ tạo điểm nhấn -->
    <circle cx="15" cy="5" r="5" fill="#E9A12E" />
    <circle cx="78" cy="40" r="5" fill="#E9A12E" />
  </g>
</svg>
