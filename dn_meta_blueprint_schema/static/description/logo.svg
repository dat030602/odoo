<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Gradient cho biểu tượng thêm tính công nghệ -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1" /> <!-- Tím đặc trưng Odoo -->
      <stop offset="100%" style="stop-color:#017E84;stop-opacity:1" /> <!-- Xanh Teal công nghệ -->
    </linearGradient>
  </defs>

  <!-- Biểu tượng (Icon) -->
  <g transform="translate(10, 10)">
    <!-- Khối đa giác đại diện cho dữ liệu tích hợp -->
    <path d="M 20,10 L 55,10 C 75,10 80,25 80,40 C 80,55 75,70 55,70 L 20,70 Z" fill="none" stroke="url(#techGradient)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 40,30 L 40,70 L 60,30 L 60,70" fill="none" stroke="#2C3E50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="10" r="5" fill="#E9A12E" />
    <circle cx="80" cy="40" r="5" fill="#E9A12E" />
  </g>

  <!-- Chữ Thương Hiệu (Text) -->
  <g transform="translate(110, 62)">
    <!-- Phần tên chính -->
    <text font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#2C3E50" letter-spacing="1">DAT</text>
    <!-- Phần hậu tố / dịch vụ -->
    <text font-family="Arial, sans-serif" font-size="42" font-weight="300" fill="#714B67" x="95">NV</text>
    <!-- Slogan nhỏ phía dưới nếu cần -->
    <text font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#95A5A6" x="2" y="22" letter-spacing="4">SOLUTIONS &amp; ERP</text>
  </g>
</svg>
